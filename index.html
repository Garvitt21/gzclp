<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>GZCLP Tracker</title>
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#242b34;--text:#e8ecf1;--mut:#8b97a6;--acc:#4ade80;--warn:#fbbf24;--bad:#f87171;--line:#2d3641}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px}
h1{font-size:22px;margin:0}
.sub{color:var(--mut);font-size:14px}
main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--acc);margin-right:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex{font-size:18px;font-weight:600}
.scheme{color:var(--mut);font-size:14px;margin:2px 0 10px}
.w{font-size:20px;font-weight:700;color:var(--acc)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);background:var(--card2);color:var(--mut);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none}
.w input{width:90px;font-size:20px;font-weight:700;color:var(--acc)}
.scheme input{width:56px;padding:6px;text-align:center;font-size:14px}
input.set{padding:0;text-align:center;font-family:inherit;appearance:textfield;-moz-appearance:textfield}
input.set::-webkit-outer-spin-button,input.set::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.set::placeholder{color:var(--mut);opacity:1}
.set.done{background:var(--acc);border-color:var(--acc);color:#05260f}
.set.short{background:var(--warn);border-color:var(--warn);color:#2b1d00}
.set.zero{background:var(--bad);border-color:var(--bad);color:#2b0000}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--card2);color:var(--text);font-weight:600}
button.pri{background:var(--acc);color:#05260f}
button.bad{background:#3a1d1d;color:var(--bad)}
button.full{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1013;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;color:var(--mut);padding:14px 4px}
nav button.on{color:var(--acc)}
select,input{font:inherit;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:90px;text-align:right}
.cfg{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:center;margin:6px 0}
.cfg b{font-weight:600}
.hint{color:var(--mut);font-size:13px}
.big{font-size:20px;font-weight:700}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mut);margin:2px 4px 2px 0}
.up{color:var(--acc)}.dn{color:var(--bad)}
.hist summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.tabs button{padding:8px 12px;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#05260f}
svg{width:100%;height:150px}
.days{display:flex;gap:6px;margin:8px 0}
.days div{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.days div.tr{color:var(--text)}
.days div{cursor:pointer}
.days div.today{border-color:var(--acc)}
.days div.edit{background:var(--card2);box-shadow:0 0 0 1px var(--mut)}
</style>
</head>
<body>
<header><h1>GZCLP</h1><div class="sub" id="sub"></div></header>
<main id="main"></main>
<nav>
  <button data-v="today" class="on">Today</button>
  <button data-v="history">History</button>
  <button data-v="progress">Progress</button>
  <button data-v="settings">Settings</button>
</nav>

<script>
// ---------- Program definition ----------
const LIFTS = {
  squat:{name:'Squat',lower:true}, bench:{name:'Bench Press',lower:false},
  ohp:{name:'Overhead Press',lower:false}, deadlift:{name:'Deadlift',lower:true},
  lat:{name:'Lat Pulldown',lower:false}, row:{name:'Dumbbell Row',lower:false}
};
// Day 1..4 -> [T1, T2, T3]
const DAYS = [
  {t1:'squat', t2:'bench', t3:'lat'},
  {t1:'ohp', t2:'deadlift', t3:'row'},
  {t1:'bench', t2:'squat', t3:'lat'},
  {t1:'deadlift', t2:'ohp', t3:'row'}
];
const T1 = [{sets:5,reps:3},{sets:6,reps:2},{sets:10,reps:1}];
const T2 = [{sets:3,reps:10},{sets:3,reps:8},{sets:3,reps:6}];
const T3 = {sets:3,reps:15,target:25};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEF_SCHED = {1:0,2:1,5:2}; // weekday -> day index: Mon=Day1, Tue=Day2, Fri=Day3

// ---------- State ----------
const KEY='gzclp_v1';
function defaults(){
  return {
    unit:'kg', nextDay:0, sched:{...DEF_SCHED}, current:null, history:[],
    lifts:{
      squat:{t1:60,t1s:0,t2:40,t2s:0}, bench:{t1:40,t1s:0,t2:30,t2s:0},
      ohp:{t1:25,t1s:0,t2:20,t2s:0}, deadlift:{t1:70,t1s:0,t2:50,t2s:0},
      lat:{t3:30}, row:{t3:15}
    }
  };
}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || defaults(); }catch(e){ S = defaults(); }
if(!S.sched) S.sched={...DEF_SCHED};
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
let view='today', progLift='squat', editWd=null;

const r25 = x => Math.round(x/2.5)*2.5;
const fmt = x => (Math.round(x*100)/100).toString();
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Workout building ----------
function buildWorkout(dayIdx){
  const d = DAYS[dayIdx];
  const L = S.lifts;
  const mk = (tier,lift,w,sets,reps,amrapLast)=>({tier,lift,weight:w,sets,reps,amrapLast,done:Array(sets).fill(null)});
  const a = L[d.t1], b = L[d.t2], c = L[d.t3];
  return {
    day:dayIdx, start:new Date().toISOString(),
    ex:[
      mk('T1',d.t1,a.t1,T1[a.t1s].sets,T1[a.t1s].reps,true),
      mk('T2',d.t2,b.t2,T2[b.t2s].sets,T2[b.t2s].reps,false),
      mk('T3',d.t3,c.t3,T3.sets,T3.reps,true)
    ]
  };
}

// ---------- Tap handling ----------
function adjustWeight(ei,delta){
  const e = S.current.ex[ei];
  e.weight = Math.max(0, r25(e.weight+delta));
  save(); render();
}

function setWeight(ei,v){
  const n=parseFloat(v); if(isNaN(n)||n<0) return render();
  S.current.ex[ei].weight=n; save(); render();
}
function setScheme(ei,idx){
  const e=S.current.ex[ei], t=(e.tier==='T1'?T1:T2)[+idx];
  e.sets=t.sets; e.reps=t.reps; e.done=Array(t.sets).fill(null);
  save(); render();
}
function setResult(ei,v){
  const e=S.current.ex[ei];
  if(v==='pending') e.done=Array(e.sets).fill(null);
  else if(v==='done') e.done=Array(e.sets).fill(e.reps);
  else if(v==='amrap'){ e.done=Array(e.sets).fill(e.reps); e.done[e.sets-1]=T3.target; }
  else { e.done=Array(e.sets).fill(e.reps); e.done[e.sets-1]=Math.max(0,e.reps-1); }
  save(); render();
}

// ---------- Finish + progression ----------
function evalExercise(e){
  if(e.done.some(x=>x===null)) return null;
  if(e.tier==='T3') return e.done[e.sets-1] >= T3.target;
  // T1/T2: every set must hit target reps
  return e.done.every((x,i)=> x>=e.reps);
}
function finishWorkout(){
  const w = S.current;
  const missing = w.ex.filter(e=>e.done.some(x=>x===null));
  if(missing.length && !confirm('Some sets are not marked. Count them as failed and finish?')) return;
  const changes=[];
  w.ex.forEach(e=>{
    const sets = e.done.map(x=>x===null?0:x);
    e.done = sets;
    const ok = evalExercise(e);
    e.success = ok;
    const L = S.lifts[e.lift], lower = LIFTS[e.lift].lower;
    const name = LIFTS[e.lift].name;
    if(e.tier==='T1'){ const k=T1.findIndex(t=>t.sets===e.sets&&t.reps===e.reps); if(k>=0) L.t1s=k; }
    if(e.tier==='T2'){ const k=T2.findIndex(t=>t.sets===e.sets&&t.reps===e.reps); if(k>=0) L.t2s=k; }
    if(e.tier==='T1'){
      // progress from the weight actually lifted
      if(ok){ const inc = lower?5:2.5; L.t1 = e.weight+inc; changes.push(`${name} T1 +${inc}${S.unit} → ${fmt(L.t1)}`); }
      else if(L.t1s<2){ L.t1 = e.weight; L.t1s++; changes.push(`${name} T1 fail → ${T1[L.t1s].sets}x${T1[L.t1s].reps}`); }
      else { L.t1 = Math.max(0,r25(e.weight*0.85)); L.t1s=0; changes.push(`${name} T1 reset (85%) → 5x3 @ ${fmt(L.t1)}`); }
    } else if(e.tier==='T2'){
      if(ok){ const inc = lower?5:2.5; L.t2 = e.weight+inc; changes.push(`${name} T2 +${inc}${S.unit} → ${fmt(L.t2)}`); }
      else if(L.t2s<2){ L.t2 = e.weight; L.t2s++; changes.push(`${name} T2 fail → ${T2[L.t2s].sets}x${T2[L.t2s].reps}`); }
      else { L.t2 = e.weight+7.5; L.t2s=0; changes.push(`${name} T2 restart 3x10 @ ${fmt(L.t2)} (+7.5)`); }
    } else {
      if(ok){ L.t3 = e.weight+2.5; changes.push(`${name} T3 +2.5${S.unit} → ${fmt(L.t3)}`); }
      else L.t3 = e.weight;
    }
  });
  S.history.unshift({date:new Date().toISOString(), day:w.day, ex:w.ex, changes});
  S.nextDay = (w.day+1)%4;
  S.current = null;
  save();
  alert('Workout saved ✅\n\n'+(changes.join('\n')||'No changes'));
  render();
}
function cancelWorkout(){
  if(confirm('Discard this workout? Nothing will be saved.')){ S.current=null; save(); render(); }
}

// ---------- Views ----------
function exLabel(e){ return `${e.sets}×${e.reps}${e.amrapLast?'+':''}`; }

function vToday(){
  const now = new Date(), wd = now.getDay();
  const isTrain = S.sched[wd]!=null;
  // today's scheduled day, else the next scheduled day after today, else manual nextDay
  let sd = S.nextDay;
  for(let k=0;k<7;k++){ const v=S.sched[(wd+k)%7]; if(v!=null){ sd=v; break; } }
  let h='';
  h += '<div class="days">'+[1,2,3,4,5,6,0].map(d=>{
    const t=S.sched[d]!=null;
    return `<div class="${t?'tr':''} ${d===wd?'today':''} ${d===editWd?'edit':''}" onclick="editWd=editWd===${d}?null:${d};render()">${WD[d]}<br>${t?'💪 D'+(S.sched[d]+1):'rest'}</div>`;
  }).join('')+'</div>';
  if(editWd!=null){
    const cv=S.sched[editWd];
    h += `<div class="card"><div class="row"><span>${WD[editWd]}</span>
      <select style="width:auto;text-align:left" onchange="setSched(${editWd},this.value)">
        <option value="rest" ${cv==null?'selected':''}>Rest day</option>
        ${[0,1,2,3].map(i=>`<option value="${i}" ${cv===i?'selected':''}>Workout – Day ${i+1}</option>`).join('')}
      </select></div></div>`;
  }

  if(!S.current){
    const d = sd, day = DAYS[d];
    h += `<div class="card"><div class="big">${isTrain?'Today is a training day':'Today is a rest day'}</div>
      <div class="hint">Next: Day ${d+1} of 4</div>
      <div style="margin-top:10px">${['t1','t2','t3'].map((t,i)=>{
        const lf=day[t], L=S.lifts[lf];
        const w = i===0?L.t1:i===1?L.t2:L.t3;
        const sc = i===0?T1[L.t1s]:i===1?T2[L.t2s]:T3;
        return `<div class="row" style="margin:6px 0"><span><span class="tier">T${i+1}</span>${LIFTS[lf].name}</span><span class="hint">${sc.sets}×${sc.reps}${i!==1?'+':''} @ <b style="color:var(--acc)">${fmt(w)}${S.unit}</b></span></div>`;
      }).join('')}</div>
      <button class="pri full" style="margin-top:12px" onclick="startWorkout()">${isTrain?'Start Day '+(d+1):'Train anyway – Day '+(d+1)}</button>
      <div class="row" style="margin-top:8px"><span class="hint">Want a different day?</span>
        <span>${[0,1,2,3].map(i=>`<button style="padding:6px 10px;margin-left:4px" onclick="startWorkout(${i})">${i+1}</button>`).join('')}</span></div>
    </div>`;
    return h;
  }

  const w = S.current;
  h += `<div class="sub" style="margin:4px 0">Day ${w.day+1} • Pick the result from the dropdown (T1/T2 also let you pick sets×reps) • T3: same, pick 'Last set 25+' to add weight</div>`;
  w.ex.forEach((e,ei)=>{
    const ok = evalExercise(e);
    h += `<div class="card">
      <div class="row"><div><span class="tier">${e.tier}</span><span class="ex">${LIFTS[e.lift].name}</span></div>
        <div class="w"><input type="number" inputmode="decimal" step="2.5" min="0" value="${fmt(e.weight)}" onchange="setWeight(${ei},this.value)"><span class="hint"> ${S.unit}</span></div></div>
      ${e.tier==='T3' ? `<div class="row"><div class="scheme">${exLabel(e)} (25+ on last set to progress)</div>
        <div><button style="padding:4px 10px" onclick="adjustWeight(${ei},-2.5)">−</button>
        <button style="padding:4px 10px" onclick="adjustWeight(${ei},2.5)">+</button></div></div>
      <div class="row" style="margin-top:6px"><span></span>
        <select style="width:auto;text-align:left" onchange="setResult(${ei},this.value)">${(()=>{
          const res = e.done.every(x=>x===null)?'pending':(evalExercise(e)?'amrap':(e.done.every(x=>x>=e.reps)?'done':'fail'));
          return [['pending','Result: pending'],['done','All sets done ✓'],['amrap',`Last set ${T3.target}+ ✓ (add weight)`],['fail','Failed ✗']]
            .map(([v,t])=>`<option value="${v}" ${res===v?'selected':''}>${t}</option>`).join('');
        })()}</select></div>` : (()=>{
        const tbl = e.tier==='T1'?T1:T2;
        const cur = tbl.findIndex(t=>t.sets===e.sets&&t.reps===e.reps);
        const res = e.done.every(x=>x===null)?'pending':(evalExercise(e)?'done':'fail');
        const plus = e.amrapLast?'+':'';
        return `<div class="row" style="margin-top:6px">
          <select style="width:auto;text-align:left" onchange="setScheme(${ei},this.value)">${tbl.map((t,i)=>`<option value="${i}" ${cur===i?'selected':''}>${t.sets}×${t.reps}${plus}</option>`).join('')}${cur<0?`<option selected>${e.sets}×${e.reps}${plus}</option>`:''}</select>
          <select style="width:auto;text-align:left" onchange="setResult(${ei},this.value)">
            <option value="pending" ${res==='pending'?'selected':''}>Result: pending</option>
            <option value="done" ${res==='done'?'selected':''}>All sets done ✓</option>
            <option value="fail" ${res==='fail'?'selected':''}>Failed ✗</option></select>
          <span><button style="padding:4px 10px" onclick="adjustWeight(${ei},-2.5)">−</button>
          <button style="padding:4px 10px" onclick="adjustWeight(${ei},2.5)">+</button></span></div>`;
      })()}
    </div>`;
  });
  h += `<button class="pri full" onclick="finishWorkout()">Finish workout</button>
        <button class="bad full" style="margin-top:8px" onclick="cancelWorkout()">Discard</button>`;
  return h;
}
function setSched(wd,v){
  if(v==='rest') delete S.sched[wd]; else S.sched[wd]=+v;
  save(); render();
}
function startWorkout(d){
  if(d==null){ const wd=new Date().getDay(); d=S.nextDay; for(let k=0;k<7;k++){ const v=S.sched[(wd+k)%7]; if(v!=null){ d=v; break; } } }
  S.current = buildWorkout(d);
  save(); render();
}

function vHistory(){
  if(!S.history.length) return '<div class="card hint">No workouts yet. Do your first workout!</div>';
  return S.history.map((h,i)=>{
    const dt = new Date(h.date);
    return `<details class="card hist"><summary>${dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})} • Day ${h.day+1}</summary>
      ${h.ex.map(e=>`<div style="margin:8px 0"><span class="tier">${e.tier}</span><b>${LIFTS[e.lift].name}</b> ${fmt(e.weight)}${S.unit} ${e.success?'<span class="up">✓</span>':'<span class="dn">✗</span>'}
        <div class="hint">${e.done.join(' / ')}</div></div>`).join('')}
      ${h.changes&&h.changes.length?'<div class="hint" style="margin-top:6px">'+h.changes.map(esc).join('<br>')+'</div>':''}
      <button class="bad" style="margin-top:10px;padding:6px 12px" onclick="delHistory(${i})">Delete</button>
    </details>`;
  }).join('');
}
function delHistory(i){ if(confirm('Delete this entry?')){ S.history.splice(i,1); save(); render(); } }

function vProgress(){
  const keys = Object.keys(LIFTS);
  let h = `<div class="tabs">${keys.map(k=>`<button class="${k===progLift?'on':''}" onclick="progLift='${k}';render()">${LIFTS[k].name}</button>`).join('')}</div>`;
  const pts=[];
  [...S.history].reverse().forEach(x=>x.ex.forEach(e=>{
    if(e.lift===progLift && (e.tier==='T1'||e.tier==='T3'||e.tier==='T2')) pts.push({d:x.date,w:e.weight,t:e.tier});
  }));
  const main = pts.filter(p=>p.t===(progLift==='lat'||progLift==='row'?'T3':'T1'));
  if(main.length<2) h += '<div class="card hint">You need at least 2 sessions to show the graph.</div>';
  else {
    const W=320,H=150,p=14, ys=main.map(m=>m.w), mn=Math.min(...ys), mx=Math.max(...ys), rng=(mx-mn)||1;
    const X=i=>p+i*(W-2*p)/(main.length-1), Y=v=>H-p-(v-mn)/rng*(H-2*p);
    h += `<div class="card"><div class="hint">${LIFTS[progLift].name} – main working weight</div>
      <svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#4ade80" stroke-width="2.5" points="${main.map((m,i)=>X(i)+','+Y(m.w)).join(' ')}"/>
      ${main.map((m,i)=>`<circle cx="${X(i)}" cy="${Y(m.w)}" r="3.5" fill="#4ade80"/>`).join('')}</svg>
      <div class="row"><span class="hint">Start ${fmt(ys[0])}${S.unit}</span><span class="big up">${fmt(ys[ys.length-1])}${S.unit}</span></div></div>`;
  }
  const L=S.lifts[progLift];
  h += `<div class="card"><div class="hint">Current</div>
    ${L.t1!=null?`<div>T1: <b>${fmt(L.t1)}${S.unit}</b> ${T1[L.t1s].sets}×${T1[L.t1s].reps}+</div><div>T2: <b>${fmt(L.t2)}${S.unit}</b> ${T2[L.t2s].sets}×${T2[L.t2s].reps}</div>`:''}
    ${L.t3!=null?`<div>T3: <b>${fmt(L.t3)}${S.unit}</b> 3×15+</div>`:''}</div>`;
  const total = S.history.length;
  h += `<div class="card"><span class="pill">${total} workouts</span></div>`;
  return h;
}

function vSettings(){
  const row=(k)=>{
    const L=S.lifts[k];
    if(L.t1!=null) return `<div class="cfg"><b>${LIFTS[k].name}</b>
      <input type="number" step="2.5" value="${L.t1}" onchange="setW('${k}','t1',this.value)">
      <input type="number" step="2.5" value="${L.t2}" onchange="setW('${k}','t2',this.value)"></div>
      <div class="cfg"><span class="hint">stage</span>
      <select onchange="setW('${k}','t1s',this.value)">${T1.map((t,i)=>`<option value="${i}" ${L.t1s===i?'selected':''}>${t.sets}x${t.reps}</option>`).join('')}</select>
      <select onchange="setW('${k}','t2s',this.value)">${T2.map((t,i)=>`<option value="${i}" ${L.t2s===i?'selected':''}>${t.sets}x${t.reps}</option>`).join('')}</select></div>`;
    return `<div class="cfg"><b>${LIFTS[k].name}</b><input type="number" step="2.5" value="${L.t3}" onchange="setW('${k}','t3',this.value)"><span></span></div>`;
  };
  return `<div class="card"><div class="big">Starting weights (${S.unit})</div>
    <div class="cfg hint"><span></span><span style="text-align:right">T1</span><span style="text-align:right">T2</span></div>
    ${['squat','bench','ohp','deadlift','lat','row'].map(row).join('')}
    <div class="hint">Stage = the sets×reps scheme you are currently on. T1 ≈ 5RM, T2 ≈ 65% of T1, T3 ≈ light (15 reps feel easy). Lat/Row only have T3.</div></div>
  <div class="card"><div class="big">Next workout</div>
    <div class="row" style="margin-top:8px">${[0,1,2,3].map(i=>`<button class="${S.nextDay===i?'pri':''}" onclick="S.nextDay=${i};save();render()">Day ${i+1}</button>`).join('')}</div></div>
  <div class="card"><div class="big">Unit</div>
    <div class="row" style="margin-top:8px"><button class="${S.unit==='kg'?'pri':''}" onclick="S.unit='kg';save();render()">kg</button><button class="${S.unit==='lb'?'pri':''}" onclick="S.unit='lb';save();render()">lb</button></div></div>
  <div class="card"><div class="big">Backup</div>
    <div class="row" style="margin-top:8px"><button onclick="exportData()">Export</button><button onclick="importData()">Import</button><button class="bad" onclick="resetAll()">Reset</button></div></div>
  <div class="card hint"><b>Rules</b><br>
    T1: 5×3+ → 6×2+ → 10×1+; success +5 (lower) / +2.5 (upper); after 3 failed stages, reset to 85%.<br>
    T2: 3×10 → 3×8 → 3×6; success +5/+2.5; if the last stage fails, add 7.5 and restart at 3×10.<br>
    T3: 3×15+; +2.5 when the last set reaches 25+ reps.</div>`;
}
function setW(k,f,v){ const n=parseFloat(v); if(isNaN(n)) return; S.lifts[k][f]=n; save(); render(); }
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='gzclp-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importData(){
  const i=document.createElement('input'); i.type='file'; i.accept='application/json';
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; f.text().then(t=>{ try{ const o=JSON.parse(t); if(!o.lifts) throw 0; S=o; save(); render(); }catch(e){ alert('Invalid file'); } }); };
  i.click();
}
function resetAll(){ if(confirm('All data will be deleted. Are you sure?')){ S=defaults(); save(); render(); } }

// ---------- Render ----------
function render(){
  const v = {today:vToday,history:vHistory,progress:vProgress,settings:vSettings}[view];
  el('main').innerHTML = v();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  el('sub').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);});
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
